<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not in this copy — Triptych (local copy)</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 60%, #2a1230 0%, #1a1a1a 55%, #0c0c0c 100%);
      color: #f8f5ee;
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 560px; padding: 40px 28px; }
    .tag { color: #c04bff; font-weight: 700; letter-spacing: .3em; font-size: 12px; text-transform: uppercase; }
    h1 { font-size: 30px; line-height: 1.2; margin: 0 0 14px; }
    p { color: #d6d0dc; }
    code { background: #1e1527; border: 1px solid #3a2550; border-radius: 6px; padding: 1px 7px;
           font: 14px ui-monospace, Consolas, monospace; color: #ecd2ff; }
    a.button { display: inline-block; margin-top: 10px; padding: 10px 22px; border-radius: 999px;
               background: #af00f1; color: #fff; text-decoration: none; font-weight: 600; }
    a.button:hover { background: #c04bff; }
  </style>
</head>
<body>
  <main>
    <p class="tag">Triptych &middot; local copy</p>
    <h1>This page isn’t part of the downloaded copy</h1>
    <p>
      <code id="requested-path">This page</code> was not saved — only the homepage was downloaded,
      so links such as Portfolio, Services, About, Insights and Contact have nothing to show locally.
    </p>
    <a class="button" href="/">Back to the homepage</a>
  </main>
  <script>
    document.getElementById('requested-path').textContent = location.pathname;
  </script>
</body>
</html>
